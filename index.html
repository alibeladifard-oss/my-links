<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه شخصی - مدیریت رمز</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
        }

        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; margin: 0; min-height: 100vh;
        }

        #admin-bar {
            display: none; width: 100%; background: var(--success-color);
            color: white; text-align: center; padding: 10px 0;
            position: fixed; top: 0; left: 0; z-index: 10001; font-weight: bold;
        }

        .profile-container { text-align: center; width: 100%; max-width: 400px; margin-top: 50px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent-color); margin-bottom: 15px; }
        
        .links-wrapper { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .link-card {
            background-color: var(--card-bg); color: white; text-decoration: none;
            padding: 15px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; gap: 10px; position: relative;
        }

        /* دایره ورود مخفی */
        #admin-trigger {
            display: none; position: fixed; bottom: 20px; left: 20px;
            width: 15px; height: 15px; background: rgba(255,255,255,0.2);
            border-radius: 50%; cursor: pointer; z-index: 9999;
        }

        /* باکس ورود */
        #login-box {
            display: none; position: fixed; bottom: 45px; left: 20px;
            background: #1e293b; padding: 12px; border-radius: 8px;
            border: 1px solid #334155; flex-direction: column; gap: 8px; z-index: 10000;
        }

        #login-box input, #settings-box input {
            background: #0f172a; border: 1px solid #334155; color: white;
            padding: 8px; border-radius: 4px; outline: none; width: 150px; font-size: 12px;
        }

        .action-btn {
            background: var(--accent-color); color: #000; border: none;
            padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }

        /* مربع تنظیمات در حالت ادیت */
        #settings-trigger {
            display: none; position: fixed; bottom: 20px; left: 20px;
            width: 25px; height: 25px; background: #475569;
            border-radius: 4px; cursor: pointer; z-index: 9999;
            align-items: center; justify-content: center; color: white;
        }

        #settings-box {
            display: none; position: fixed; bottom: 55px; left: 20px;
            background: #1e293b; padding: 15px; border-radius: 8px;
            border: 1px solid var(--accent-color); flex-direction: column; gap: 8px; z-index: 10000;
        }

        /* استایل‌های ویرایش */
        .edit-mode #admin-bar, .edit-mode #settings-trigger { display: flex; }
        .edit-mode .editable { border: 2px dashed var(--accent-color); padding: 5px; cursor: pointer; }
        
        .delete-btn {
            display: none; position: absolute; right: -10px; top: -10px;
            background: #ef4444; color: white; border-radius: 50%;
            width: 25px; height: 25px; border: none; cursor: pointer;
            z-index: 100; align-items: center; justify-content: center;
        }
        .edit-mode .delete-btn { display: flex; }

        .add-btn {
            display: none; margin-top: 25px; background: var(--success-color);
            border: none; padding: 15px; border-radius: 10px; cursor: pointer;
            width: 100%; font-weight: bold; color: white;
        }
        .edit-mode .add-btn { display: block; }
    </style>
</head>
<body id="main-body">

    <div id="admin-bar">✅ حالت ویرایش فعال شد</div>

    <div class="profile-container">
        <img src="https://via.placeholder.com/100" class="profile-img">
        <h1 id="user-name" class="editable" onclick="editText('user-name')">نام شما</h1>
        <p id="user-bio" class="editable" onclick="editText('user-bio')">توضیحات کوتاه</p>

        <div id="links-container" class="links-wrapper"></div>
        <button class="add-btn" onclick="addNewLink()">+ افزودن لینک جدید</button>
    </div>

    <div id="admin-trigger" onclick="toggleBox('login-box')"></div>
    
    <div id="login-box">
        <input type="password" id="u-field" placeholder="1">
        <input type="password" id="p-field" placeholder="2">
        <button class="action-btn" onclick="processLogin()">ورود</button>
    </div>

    <div id="settings-trigger" onclick="toggleBox('settings-box')">
        <i class="fas fa-cog"></i>
    </div>

    <div id="settings-box">
        <div id="verify-step">
            <p style="font-size: 10px; margin: 0;">تایید رمز فعلی:</p>
            <input type="password" id="old-u" placeholder="رمز 1 فعلی">
            <input type="password" id="old-p" placeholder="رمز 2 فعلی">
            <button class="action-btn" onclick="verifyForChange()" style="margin-top:5px; width: 100%;">مرحله بعد</button>
        </div>
        <div id="new-creds-step" style="display: none;">
            <p style="font-size: 10px; margin: 0;">رمز 1 جدید و تکرار:</p>
            <input type="password" id="new-u1" placeholder="رمز 1 جدید">
            <input type="password" id="new-u2" placeholder="تکرار رمز 1">
            <hr style="width:100%; border:0; border-top:1px solid #334155;">
            <p style="font-size: 10px; margin: 0;">رمز 2 جدید و تکرار:</p>
            <input type="password" id="new-p1" placeholder="رمز 2 جدید">
            <input type="password" id="new-p2" placeholder="تکرار رمز 2">
            <button class="action-btn" onclick="saveNewCreds()" style="margin-top:5px; width: 100%; background: var(--success-color); color: white;">ذخیره نهایی</button>
        </div>
    </div>

    <script>
        let isAdmin = false;
        
        // دریافت رمزها از حافظه یا استفاده از مقادیر پیش‌فرض شما
        let storedU = localStorage.getItem('adminU') || "100";
        let storedP = localStorage.getItem('adminP') || "200";

        let links = JSON.parse(localStorage.getItem('myLinks')) || [
            { title: 'اینستاگرام', url: '#', color: '#1e293b' }
        ];

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.altKey && e.shiftKey && e.code === 'KeyL') {
                const trg = document.getElementById('admin-trigger');
                trg.style.display = (trg.style.display === 'block') ? 'none' : 'block';
            }
        });

        function toggleBox(id) {
            const box = document.getElementById(id);
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        function processLogin() {
            const u = document.getElementById('u-field').value;
            const p = document.getElementById('p-field').value;

            if (u === storedU && p === storedP) {
                isAdmin = true;
                document.body.classList.add('edit-mode');
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-trigger').style.display = 'none';
                renderLinks();
            } else {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-trigger').style.display = 'none';
            }
        }

        // بخش تغییر رمز
        function verifyForChange() {
            const ou = document.getElementById('old-u').value;
            const op = document.getElementById('old-p').value;
            if(ou === storedU && op === storedP) {
                document.getElementById('verify-step').style.display = 'none';
                document.getElementById('new-creds-step').style.display = 'flex';
            } else {
                alert("رمزهای فعلی اشتباه است.");
            }
        }

        function saveNewCreds() {
            const nu1 = document.getElementById('new-u1').value;
            const nu2 = document.getElementById('new-u2').value;
            const np1 = document.getElementById('new-p1').value;
            const np2 = document.getElementById('new-p2').value;

            if(nu1 === nu2 && np1 === np2 && nu1 !== "" && np1 !== "") {
                storedU = nu1;
                storedP = np1;
                localStorage.setItem('adminU', nu1);
                localStorage.setItem('adminP', np1);
                alert("رمزها با موفقیت تغییر کرد.");
                toggleBox('settings-box');
                // ریست فرم برای دفعه بعد
                document.getElementById('verify-step').style.display = 'block';
                document.getElementById('new-creds-step').style.display = 'none';
            } else {
                alert("خطا: رمزهای جدید با تکرارشان همخوانی ندارند یا خالی هستند.");
            }
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            container.innerHTML = '';
            links.forEach((link, index) => {
                const div = document.createElement('div');
                div.className = 'link-card';
                div.style.backgroundColor = link.color;
                div.innerHTML = `
                    <span>${link.title}</span>
                    <button class="delete-btn" onclick="removeLink(event, ${index})">×</button>
                `;
                div.onclick = () => { 
                    if(isAdmin) editExistingLink(index);
                    else if(link.url !== "#") window.location.href = link.url;
                };
                container.appendChild(div);
            });
        }

        function editText(id) {
            if(!isAdmin) return;
            const val = prompt("تغییر متن:", document.getElementById(id).innerText);
            if(val) document.getElementById(id).innerText = val;
        }

        function addNewLink() {
            const t = prompt("عنوان:");
            const u = prompt("آدرس:", "https://");
            if(t && u) {
                links.push({title:t, url:u, color:'#1e293b'});
                saveAndRefresh();
            }
        }

        function removeLink(e, index) {
            e.stopPropagation();
            if(confirm("حذف؟")) { links.splice(index, 1); saveAndRefresh(); }
        }

        function editExistingLink(index) {
            const t = prompt("عنوان جدید:", links[index].title);
            if(t) {
                links[index].title = t;
                links[index].url = prompt("آدرس جدید:", links[index].url);
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('myLinks', JSON.stringify(links));
            renderLinks();
        }

        renderLinks();
    </script>
</body>
</html>
