<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست حالت ویرایش</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --accent-color: #38bdf8;
        }

        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; margin: 0; min-height: 100vh;
            transition: background 0.5s;
        }

        /* تغییر رنگ پس‌زمینه برای تشخیص حالت ادیت */
        body.edit-mode { background-color: #1e293b; }

        #admin-bar {
            display: none; width: 100%; background: #22c55e;
            color: white; text-align: center; padding: 10px 0;
            position: fixed; top: 0; left: 0; z-index: 9999; font-weight: bold;
        }
        body.edit-mode #admin-bar { display: block; }

        .profile-container { text-align: center; width: 100%; max-width: 400px; margin-top: 50px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent-color); margin-bottom: 15px; }
        
        .links-wrapper { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .link-card {
            background-color: var(--card-bg); color: white; text-decoration: none;
            padding: 15px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; gap: 10px; position: relative;
        }

        /* دایره تست */
        #admin-trigger {
            display: none; position: fixed; bottom: 20px; left: 20px;
            width: 20px; height: 20px; background: red; /* قرمز گذاشتم که کاملاً دیده شود */
            border-radius: 50%; cursor: pointer; z-index: 10000;
        }

        /* استایل‌های ویرایش */
        .edit-mode .editable { border: 2px dashed #38bdf8; padding: 5px; cursor: pointer; margin: 5px 0; }
        
        .delete-btn {
            display: none; position: absolute; right: -10px; top: -10px;
            background: #ef4444; color: white; border-radius: 50%;
            width: 25px; height: 25px; border: none; cursor: pointer;
            z-index: 100; font-weight: bold;
        }
        .edit-mode .delete-btn { display: flex; align-items: center; justify-content: center; }

        .add-btn {
            display: none; margin-top: 25px; background: #22c55e;
            border: none; padding: 15px; border-radius: 10px; cursor: pointer;
            width: 100%; font-weight: bold; color: white;
        }
        .edit-mode .add-btn { display: block; }
    </style>
</head>
<body>

    <div id="admin-bar">✅ شما در حالت ویرایش هستید</div>

    <div class="profile-container">
        <img src="https://via.placeholder.com/100" class="profile-img">
        <h1 id="user-name" class="editable" onclick="editText('user-name')">نام شما (کلیک برای تغییر)</h1>
        <p id="user-bio" class="editable" onclick="editText('user-bio')">توضیحات (کلیک برای تغییر)</p>

        <div id="links-container" class="links-wrapper"></div>
        <button class="add-btn" onclick="addNewLink()">+ افزودن لینک جدید</button>
    </div>

    <div id="admin-trigger" onclick="activateAdmin()"></div>

    <script>
        let isAdmin = false;
        let links = JSON.parse(localStorage.getItem('testLinks')) || [
            { title: 'اینستاگرام', url: '#', icon: 'fa-instagram', color: '#1e293b' }
        ];

        // ۱. شورتکات دایره قرمز را نشان می‌دهد
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.altKey && e.shiftKey && e.code === 'KeyL') {
                document.getElementById('admin-trigger').style.display = 'block';
                console.log("Shortcut detected - Circle should be visible");
            }
        });

        // ۲. کلیک روی دایره مستقیماً ادمین می‌کند
        function activateAdmin() {
            isAdmin = true;
            document.body.classList.add('edit-mode');
            document.getElementById('admin-trigger').style.display = 'none';
            renderLinks();
            console.log("Admin activated");
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            container.innerHTML = '';
            links.forEach((link, index) => {
                const div = document.createElement('div');
                div.className = 'link-card';
                div.style.backgroundColor = link.color;
                div.innerHTML = `
                    <span>${link.title}</span>
                    <button class="delete-btn" onclick="removeLink(event, ${index})">×</button>
                `;
                div.onclick = () => { 
                    if(isAdmin) editLink(index);
                    else alert("در حالت عادی لینک باز می‌شود");
                };
                container.appendChild(div);
            });
        }

        function editText(id) {
            if(!isAdmin) return;
            const val = prompt("متن جدید را وارد کنید:");
            if(val) document.getElementById(id).innerText = val;
        }

        function addNewLink() {
            const t = prompt("عنوان لینک:");
            if(t) {
                links.push({title: t, url: '#', color: '#1e293b'});
                save();
            }
        }

        function removeLink(e, index) {
            e.stopPropagation();
            links.splice(index, 1);
            save();
        }

        function editLink(index) {
            const t = prompt("عنوان جدید:", links[index].title);
            if(t) {
                links[index].title = t;
                save();
            }
        }

        function save() {
            localStorage.setItem('testLinks', JSON.stringify(links));
            renderLinks();
        }

        renderLinks();
    </script>
</body>
</html>
