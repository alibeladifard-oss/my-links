<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت لینک‌های من</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --accent-color: #38bdf8;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            transition: all 0.3s;
        }

        .profile-container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .editable:hover { outline: 2px dashed var(--accent-color); cursor: pointer; }

        .profile-img {
            width: 100px; height: 100px;
            border-radius: 50%; border: 3px solid var(--accent-color);
            margin-bottom: 15px; object-fit: cover;
        }

        .links-wrapper { display: flex; flex-direction: column; gap: 15px; width: 100%; }

        .link-card {
            background-color: var(--card-bg);
            color: white; text-decoration: none;
            padding: 15px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; transition: 0.3s; position: relative;
        }

        .link-card:hover { transform: translateY(-3px); filter: brightness(1.2); }

        /* پنل مدیریت مخفی */
        #admin-panel {
            display: none;
            position: fixed; bottom: 20px; left: 20px;
            background: #38bdf8; color: #000;
            padding: 15px; border-radius: 50px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .edit-mode .delete-btn {
            position: absolute; right: -10px; top: -10px;
            background: red; color: white; border-radius: 50%;
            width: 25px; height: 25px; border: none; cursor: pointer;
        }

        .add-btn {
            display: none; margin-top: 20px;
            background: var(--accent-color); border: none;
            padding: 10px 20px; border-radius: 8px; cursor: pointer;
        }

        .edit-mode .add-btn { display: block; }
    </style>
</head>
<body id="main-body">

    <div class="profile-container" id="content">
        <img src="https://via.placeholder.com/100" class="profile-img editable" id="profile-pic" onclick="editImage()">
        <h1 id="user-name" class="editable" onclick="editText('user-name')">نام شما</h1>
        <p id="user-bio" class="editable" onclick="editText('user-bio')">هنرمند دیجیتال</p>

        <div id="links-container" class="links-wrapper">
            </div>

        <button class="add-btn" onclick="addNewLink()">+ افزودن لینک جدید</button>
    </div>

    <div id="admin-panel" onclick="toggleEditMode()">
        <i class="fas fa-user-shield"></i> حالت ویرایش
    </div>

    <script>
        // برای امنیت ساده: کلید "L" را روی کیبورد بزنید تا دکمه ویرایش ظاهر شود
        window.addEventListener('keydown', (e) => {
            if(e.key.toLowerCase() === 'l') {
                document.getElementById('admin-panel').style.display = 'block';
            }
        });

        let isAdmin = false;
        let links = JSON.parse(localStorage.getItem('myLinks')) || [
            { id: 1, title: 'اینستاگرام', url: '#', icon: 'fa-instagram', color: '#1e293b' },
            { id: 2, title: 'تلگرام', url: '#', icon: 'fa-paper-plane', color: '#1e293b' }
        ];

        function renderLinks() {
            const container = document.getElementById('links-container');
            container.innerHTML = '';
            links.forEach((link, index) => {
                const a = document.createElement('div');
                a.className = 'link-card';
                a.style.backgroundColor = link.color;
                a.innerHTML = `
                    <i class="fab ${link.icon}"></i>
                    <span onclick="editLinkContent(${index})">${link.title}</span>
                    ${isAdmin ? `<button class="delete-btn" onclick="removeLink(${index})">×</button>` : ''}
                `;
                a.onclick = () => { if(!isAdmin) window.location.href = link.url; };
                container.appendChild(a);
            });
        }

        function toggleEditMode() {
            isAdmin = !isAdmin;
            document.body.classList.toggle('edit-mode');
            alert(isAdmin ? "حالت ویرایش فعال شد. روی متن‌ها کلیک کنید." : "حالت ویرایش غیرفعال شد.");
            renderLinks();
        }

        function editText(id) {
            if(!isAdmin) return;
            const newText = prompt("متن جدید را وارد کنید:", document.getElementById(id).innerText);
            if(newText) document.getElementById(id).innerText = newText;
        }

        function addNewLink() {
            const title = prompt("عنوان لینک:");
            const url = prompt("آدرس (URL):", "https://");
            const icon = prompt("کلاس آیکون FontAwesome (مثلا fa-link):", "fa-link");
            const color = prompt("رنگ پس‌زمینه (کد هگز):", "#1e293b");
            
            links.push({ title, url, icon, color });
            saveAndRefresh();
        }

        function removeLink(index) {
            links.splice(index, 1);
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem('myLinks', JSON.stringify(links));
            renderLinks();
        }

        renderLinks();
    </script>
</body>
</html>
