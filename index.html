<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت لینک‌ها - حرفه‌ای</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
            --danger-color: #ef4444;
        }

        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; margin: 0; min-height: 100vh;
        }

        #admin-bar {
            display: none; width: 100%; background: var(--success-color);
            color: white; text-align: center; padding: 10px 0;
            position: fixed; top: 0; left: 0; z-index: 10001; font-weight: bold;
        }

        .profile-container { 
            text-align: center; width: 100%; max-width: 600px; 
            margin-top: 60px; display: flex; flex-direction: column; align-items: center;
        }

        .profile-img { 
            width: 100px; height: 100px; border-radius: 50%; 
            margin-bottom: 15px; object-fit: cover; border: none !important;
        }
        
        .edit-mode .profile-img { cursor: pointer; opacity: 0.8; }

        .links-wrapper { 
            display: flex; flex-direction: column; gap: 15px; 
            width: 100%; align-items: center; margin-top: 20px;
        }
        
        .link-row {
            display: flex; align-items: center; gap: 15px;
            width: 100%; justify-content: center; position: relative;
        }

        .link-card {
            color: white; text-decoration: none;
            padding: 12px 25px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; min-width: 150px; width: fit-content;
            transition: 0.2s; cursor: pointer; border: none;
        }

        .link-icon-circle {
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--card-bg); overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border: none !important; flex-shrink: 0;
        }

        .link-icon-circle img { width: 100%; height: 100%; object-fit: cover; }

        .edit-mode .link-row { cursor: move; }
        .dragging { opacity: 0.3; }

        #admin-trigger {
            display: none; position: fixed; bottom: 20px; left: 20px;
            width: 15px; height: 15px; background: rgba(255,255,255,0.1);
            border-radius: 50%; cursor: pointer; z-index: 9999;
        }

        #login-box {
            display: none; position: fixed; bottom: 45px; left: 20px;
            background: #1e293b; padding: 12px; border-radius: 8px;
            border: 1px solid #334155; flex-direction: column; gap: 8px; z-index: 10000;
        }

        .action-btn {
            background: var(--accent-color); color: #000; border: none;
            padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }

        .edit-controls {
            display: none; flex-direction: column; gap: 10px; width: 220px; margin-top: 20px; margin-bottom: 50px;
        }
        .edit-mode .edit-controls { display: flex; }

        .control-btn {
            border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s;
        }
        .add-btn { background: #475569; }
        .save-btn { background: var(--success-color); }
        .cancel-btn { background: var(--danger-color); }

        #custom-menu {
            display: none; position: fixed; background: #1e293b;
            border: 1px solid #475569; border-radius: 8px; z-index: 10002;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; min-width: 180px;
        }
        .menu-item {
            padding: 12px 15px; color: white; cursor: pointer; font-size: 13px;
            display: flex; align-items: center; gap: 10px; transition: 0.2s; border-bottom: 1px solid #334155;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background: #334155; color: var(--accent-color); }
        .menu-item.danger:hover { color: #ff4d4d; }
        
        #color-input, #font-color-input { display: none; }
    </style>
</head>
<body id="main-body" onclick="closeMenu()">

    <div id="admin-bar">حالت ویرایش فعال است (تغییرات تا دکمه ذخیره را نزنید ثبت نمی‌شوند)</div>

    <div class="profile-container">
        <img id="p-img" src="https://via.placeholder.com/100" class="profile-img" onclick="editProfilePic()">
        <h1 id="user-name" onclick="editText('user-name')">نام شما</h1>
        <p id="user-bio" onclick="editText('user-bio')">توضیحات کوتاه</p>

        <div id="links-container" class="links-wrapper"></div>
        
        <div class="edit-controls">
            <button class="control-btn add-btn" onclick="addNewLink()">+ افزودن لینک جدید</button>
            <button class="control-btn save-btn" onclick="finalizeChanges()">ذخیره نهایی و خروج</button>
            <button class="control-btn cancel-btn" onclick="cancelChanges()">لغو تغییرات</button>
        </div>
    </div>

    <div id="admin-trigger" onclick="toggleBox('login-box')"></div>
    
    <div id="login-box" onclick="event.stopPropagation()">
        <input type="password" id="u-field" placeholder="رمز ۱" style="background:#0f172a; color:white; border:1px solid #334155; padding:8px; border-radius:4px;">
        <input type="password" id="p-field" placeholder="رمز ۲" style="background:#0f172a; color:white; border:1px solid #334155; padding:8px; border-radius:4px;">
        <button class="action-btn" onclick="processLogin()">ورود</button>
    </div>

    <div id="custom-menu">
        <div class="menu-item" onclick="editExistingLink('title')"><i class="fas fa-font"></i> تغییر عنوان</div>
        <div class="menu-item" onclick="editExistingLink('url')"><i class="fas fa-link"></i> تغییر لینک</div>
        <div class="menu-item" onclick="editExistingLink('icon')"><i class="fas fa-image"></i> تغییر آیکون</div>
        <div class="menu-item" onclick="triggerColor('bg')"><i class="fas fa-fill-drip"></i> تغییر رنگ باکس</div>
        <div class="menu-item" onclick="triggerColor('font')"><i class="fas fa-tint"></i> تغییر رنگ فونت</div>
        <div class="menu-item danger" onclick="deleteLink()"><i class="fas fa-trash"></i> حذف کامل این باکس</div>
    </div>

    <input type="color" id="color-input" onchange="applyColor('bg', this.value)">
    <input type="color" id="font-color-input" onchange="applyColor('font', this.value)">

    <script>
        let isAdmin = false;
        let activeEditIndex = null;
        
        // داده‌های اصلی که در حافظه دائمی هستند
        let profileData = JSON.parse(localStorage.getItem('profileData')) || {
            name: "نام شما", bio: "توضیحات کوتاه", img: "https://via.placeholder.com/100"
        };
        let links = JSON.parse(localStorage.getItem('myLinks')) || [
            { title: 'اینستاگرام', url: 'https://instagram.com', icon: '', color: '#1e293b', fontColor: '#ffffff' }
        ];

        // کپی موقت برای زمان ویرایش
        let tempLinks = [];
        let tempProfile = {};

        function init() {
            document.getElementById('user-name').innerText = profileData.name;
            document.getElementById('user-bio').innerText = profileData.bio;
            document.getElementById('p-img').src = profileData.img;
            renderLinks(links);
        }

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.altKey && e.shiftKey && e.code === 'KeyL') {
                document.getElementById('admin-trigger').style.display = 'block';
            }
        });

        function toggleBox(id) {
            const box = document.getElementById(id);
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        function processLogin() {
            if (document.getElementById('u-field').value === "100" && 
                document.getElementById('p-field').value === "200") {
                isAdmin = true;
                // کپی گرفتن از داده‌ها برای ویرایش موقت
                tempLinks = JSON.parse(JSON.stringify(links));
                tempProfile = JSON.parse(JSON.stringify(profileData));
                
                document.body.classList.add('edit-mode');
                document.getElementById('admin-bar').style.display = 'block';
                document.getElementById('login-box').style.display = 'none';
                renderLinks(tempLinks);
            }
        }

        function cancelChanges() {
            if(!confirm("آیا از لغو تمامی تغییرات اطمینان دارید؟")) return;
            isAdmin = false;
            document.body.classList.remove('edit-mode');
            document.getElementById('admin-bar').style.display = 'none';
            init(); // بازگشت به داده‌های اصلی
        }

        function finalizeChanges() {
            // ذخیره دائمی کپی موقت در حافظه
            links = JSON.parse(JSON.stringify(tempLinks));
            profileData = {
                name: document.getElementById('user-name').innerText,
                bio: document.getElementById('user-bio').innerText,
                img: document.getElementById('p-img').src
            };
            localStorage.setItem('myLinks', JSON.stringify(links));
            localStorage.setItem('profileData', JSON.stringify(profileData));
            
            isAdmin = false;
            document.body.classList.remove('edit-mode');
            document.getElementById('admin-bar').style.display = 'none';
            renderLinks(links);
            alert("تغییرات با موفقیت ذخیره شد.");
        }

        function renderLinks(dataArray) {
            const container = document.getElementById('links-container');
            container.innerHTML = '';
            dataArray.forEach((link, index) => {
                const row = document.createElement('div');
                row.className = 'link-row';
                row.draggable = isAdmin;

                const card = document.createElement('div');
                card.className = 'link-card';
                card.style.backgroundColor = link.color || '#1e293b';
                card.style.color = link.fontColor || '#ffffff';
                card.innerHTML = `<span>${link.title}</span>`;
                
                const iconCircle = document.createElement('div');
                iconCircle.className = 'link-icon-circle';
                iconCircle.innerHTML = link.icon ? `<img src="${link.icon}">` : `<i class="fas fa-link" style="color:var(--accent-color)"></i>`;

                card.onclick = () => { 
                    if(!isAdmin) {
                        let targetUrl = link.url;
                        if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                            targetUrl = 'https://' + targetUrl;
                        }
                        window.open(targetUrl, '_blank');
                    }
                };

                card.oncontextmenu = (e) => {
                    if(!isAdmin) return;
                    e.preventDefault();
                    e.stopPropagation();
                    activeEditIndex = index;
                    const menu = document.getElementById('custom-menu');
                    menu.style.display = 'block';
                    menu.style.top = e.clientY + 'px';
                    menu.style.left = e.clientX + 'px';
                };

                if(isAdmin) {
                    row.addEventListener('dragstart', () => row.classList.add('dragging'));
                    row.addEventListener('dragend', () => row.classList.remove('dragging'));
                }

                row.appendChild(card);
                row.appendChild(iconCircle);
                container.appendChild(row);
            });
        }

        // توابع ویرایش (تغییرات فقط روی tempLinks اعمال می‌شود)
        function triggerColor(type) {
            closeMenu();
            if(type === 'bg') document.getElementById('color-input').click();
            else document.getElementById('font-color-input').click();
        }

        function applyColor(type, val) {
            if(type === 'bg') tempLinks[activeEditIndex].color = val;
            else tempLinks[activeEditIndex].fontColor = val;
            renderLinks(tempLinks);
        }

        function editExistingLink(field) {
            closeMenu();
            let val = prompt("مقدار جدید را وارد کنید:", tempLinks[activeEditIndex][field] || "");
            if(val !== null) {
                tempLinks[activeEditIndex][field] = val;
                renderLinks(tempLinks);
            }
        }

        function deleteLink() {
            closeMenu();
            tempLinks.splice(activeEditIndex, 1);
            renderLinks(tempLinks);
        }

        function addNewLink() {
            const title = prompt("عنوان:");
            const url = prompt("آدرس:", "https://");
            if(title && url) {
                tempLinks.push({title, url, icon: '', color: '#1e293b', fontColor: '#ffffff'});
                renderLinks(tempLinks);
            }
        }

        function closeMenu() { document.getElementById('custom-menu').style.display = 'none'; }

        // جابه‌جایی Drag & Drop روی tempLinks
        const container = document.getElementById('links-container');
        container.addEventListener('dragover', e => {
            if(!isAdmin) return;
            e.preventDefault();
            const draggingItem = document.querySelector('.dragging');
            const siblings = [...container.querySelectorAll('.link-row:not(.dragging)')];
            let nextSibling = siblings.find(sibling => e.clientY <= sibling.offsetTop + sibling.offsetHeight / 2);
            container.insertBefore(draggingItem, nextSibling);
        });

        container.addEventListener('drop', () => {
            if(!isAdmin) return;
            const newOrder = [];
            document.querySelectorAll('.link-row').forEach(row => {
                const title = row.querySelector('.link-card span').innerText;
                const found = tempLinks.find(l => l.title === title);
                if(found) newOrder.push(found);
            });
            tempLinks = newOrder;
        });

        function editProfilePic() { if(!isAdmin) return; const n = prompt("لینک عکس جدید:", document.getElementById('p-img').src); if(n) document.getElementById('p-img').src = n; }
        function editText(id) { if(!isAdmin) return; const v = prompt("متن جدید:", document.getElementById(id).innerText); if(v) document.getElementById(id).innerText = v; }

        init();
    </script>
</body>
</html>
