<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه لینک‌ها</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --accent-color: #38bdf8;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; margin: 0; min-height: 100vh;
        }

        .profile-container { text-align: center; width: 100%; max-width: 400px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent-color); margin-bottom: 15px; object-fit: cover; }
        .links-wrapper { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        
        .link-card {
            background-color: var(--card-bg); color: white; text-decoration: none;
            padding: 15px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; gap: 10px; transition: 0.3s; position: relative;
        }

        /* دکمه مخفی مدیریت */
        #admin-trigger {
            display: none; position: fixed; bottom: 15px; left: 15px;
            width: 12px; height: 12px; background: rgba(255,255,255,0.1);
            border-radius: 50%; cursor: pointer; z-index: 1000;
        }

        /* باکس ورود */
        #login-box {
            display: none; position: fixed; bottom: 40px; left: 15px;
            background: #1e293b; padding: 15px; border-radius: 10px;
            border: 1px solid #334155; flex-direction: column; gap: 8px; z-index: 1001;
        }

        #login-box input {
            background: #0f172a; border: 1px solid #334155; color: white;
            padding: 8px; border-radius: 5px; outline: none;
        }

        .edit-mode .delete-btn {
            position: absolute; right: -8px; top: -8px; background: #ef4444;
            color: white; border-radius: 50%; width: 22px; height: 22px;
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .add-btn {
            display: none; margin-top: 25px; background: var(--accent-color);
            border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%;
            font-weight: bold; color: #0f172a;
        }

        .edit-mode .add-btn { display: block; }
        .editable { cursor: pointer; transition: 0.2s; }
        .edit-mode .editable:hover { outline: 1px dashed var(--accent-color); }
    </style>
</head>
<body id="main-body">

    <div class="profile-container">
        <img src="https://via.placeholder.com/100" class="profile-img" id="profile-pic">
        <h1 id="user-name" class="editable" onclick="editText('user-name')">نام شما</h1>
        <p id="user-bio" class="editable" onclick="editText('user-bio')">توضیحات کوتاه</p>

        <div id="links-container" class="links-wrapper"></div>

        <button class="add-btn" onclick="addNewLink()">+ افزودن لینک جدید</button>
    </div>

    <div id="admin-trigger" onclick="showLogin()"></div>
    
    <div id="login-box">
        <input type="text" id="user-input" placeholder="">
        <input type="password" id="pass-input" placeholder="">
        <button onclick="checkLogin()" style="background: var(--accent-color); border:none; border-radius:5px; padding:5px; cursor:pointer;">ورود</button>
    </div>

    <script>
        let isAdmin = false;
        let links = JSON.parse(localStorage.getItem('myLinks')) || [
            { title: 'اینستاگرام', url: '#', icon: 'fa-instagram', color: '#1e293b' }
        ];

        // شنود کلید ترکیبی Ctrl + Alt + Shift + L
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.altKey && e.shiftKey && e.code === 'KeyL') {
                document.getElementById('admin-trigger').style.display = 'block';
            }
        });

        function showLogin() {
            const box = document.getElementById('login-box');
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        function checkLogin() {
            const u = document.getElementById('user-input').value;
            const p = document.getElementById('pass-input').value;
            
            if(u === 'beladifard' && p === 'HldvUgd.1400') {
                isAdmin = true;
                document.body.classList.add('edit-mode');
                document.getElementById('login-box').style.display = 'none';
                renderLinks();
                alert("حالت ویرایش فعال شد.");
            } else {
                alert("اطلاعات نادرست است.");
            }
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            container.innerHTML = '';
            links.forEach((link, index) => {
                const a = document.createElement('div');
                a.className = 'link-card';
                a.style.backgroundColor = link.color;
                a.innerHTML = `
                    <i class="fab ${link.icon}"></i>
                    <span>${link.title}</span>
                    ${isAdmin ? `<button class="delete-btn" onclick="removeLink(${index})"><i class="fas fa-times"></i></button>` : ''}
                `;
                a.onclick = () => { 
                    if(!isAdmin) window.location.href = link.url;
                    else editExistingLink(index);
                };
                container.appendChild(a);
            });
        }

        function editText(id) {
            if(!isAdmin) return;
            const newText = prompt("تغییر متن:", document.getElementById(id).innerText);
            if(newText) document.getElementById(id).innerText = newText;
        }

        function addNewLink() {
            const title = prompt("عنوان لینک:");
            const url = prompt("آدرس URL:", "https://");
            const icon = prompt("کد آیکون (مثلا fa-paper-plane):", "fa-link");
            const color = prompt("کد رنگ (Hex):", "#1e293b");
            if(title && url) {
                links.push({ title, url, icon, color });
                saveAndRefresh();
            }
        }

        function removeLink(index) {
            if(confirm("آیا این لینک حذف شود؟")) {
                links.splice(index, 1);
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('myLinks', JSON.stringify(links));
            renderLinks();
        }

        renderLinks();
    </script>
</body>
</html>
