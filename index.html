<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه شخصی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --accent-color: #38bdf8;
        }

        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; margin: 0; min-height: 100vh;
        }

        /* نوار وضعیت مدیریت که در ابتدا مخفی است */
        #admin-bar {
            display: none; width: 100%; background: var(--accent-color);
            color: #000; text-align: center; padding: 5px 0;
            position: fixed; top: 0; left: 0; z-index: 10001; font-weight: bold;
        }

        .profile-container { text-align: center; width: 100%; max-width: 400px; margin-top: 40px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent-color); margin-bottom: 15px; object-fit: cover; }
        .links-wrapper { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        .link-card {
            background-color: var(--card-bg); color: white; text-decoration: none;
            padding: 15px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; gap: 10px; transition: 0.3s; position: relative;
        }

        /* دایره مدیریت */
        #admin-trigger {
            display: none; position: fixed; bottom: 15px; left: 15px;
            width: 15px; height: 15px; background: rgba(255,255,255,0.2);
            border-radius: 50%; cursor: pointer; z-index: 9999;
        }

        /* باکس ورود */
        #login-box {
            display: none; position: fixed; bottom: 40px; left: 15px;
            background: #1e293b; padding: 12px; border-radius: 8px;
            border: 1px solid #334155; flex-direction: column; gap: 8px; z-index: 10000;
        }

        #login-box input {
            background: #0f172a; border: 1px solid #334155; color: white;
            padding: 8px; border-radius: 4px; outline: none; width: 150px;
        }

        .login-submit-btn {
            background: var(--accent-color); color: #000; border: none;
            padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }

        /* استایل‌های حالت ویرایش */
        .edit-mode .editable { border: 1px dashed var(--accent-color); padding: 2px; cursor: pointer; }
        
        .delete-btn {
            display: none; position: absolute; right: -8px; top: -8px;
            background: #ef4444; color: white; border-radius: 50%;
            width: 24px; height: 24px; border: none; cursor: pointer;
            align-items: center; justify-content: center; z-index: 20;
        }
        .edit-mode .delete-btn { display: flex; }

        .add-btn {
            display: none; margin-top: 25px; background: var(--accent-color);
            border: none; padding: 12px; border-radius: 10px; cursor: pointer;
            width: 100%; font-weight: bold; color: #0f172a;
        }
        .edit-mode .add-btn { display: block; }
    </style>
</head>
<body>

    <div id="admin-bar">حالت ویرایش فعال است</div>

    <div class="profile-container">
        <img src="https://via.placeholder.com/100" class="profile-img" id="profile-pic">
        <h1 id="user-name" class="editable" onclick="editText('user-name')">نام شما</h1>
        <p id="user-bio" class="editable" onclick="editText('user-bio')">توضیحات کوتاه</p>

        <div id="links-container" class="links-wrapper"></div>
        <button class="add-btn" onclick="addNewLink()">+ افزودن لینک جدید</button>
    </div>

    <div id="admin-trigger" onclick="toggleLoginBox()"></div>
    
    <div id="login-box">
        <input type="password" id="u-field" placeholder="1">
        <input type="password" id="p-field" placeholder="2">
        <button class="login-submit-btn" onclick="processLogin()">تایید (Login)</button>
    </div>

    <script>
        let isAdmin = false;
        let failCount = parseInt(localStorage.getItem('failCount')) || 0;
        let lockUntil = parseInt(localStorage.getItem('lockUntil')) || 0;

        let links = JSON.parse(localStorage.getItem('myLinks')) || [
            { title: 'اینستاگرام', url: '#', icon: 'fa-instagram', color: '#1e293b' }
        ];

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.altKey && e.shiftKey && e.code === 'KeyL') {
                if (Date.now() < lockUntil) return;
                const trg = document.getElementById('admin-trigger');
                trg.style.display = (trg.style.display === 'block') ? 'none' : 'block';
            }
        });

        function toggleLoginBox() {
            const box = document.getElementById('login-box');
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        function processLogin() {
            const u = document.getElementById('u-field').value.trim();
            const p = document.getElementById('p-field').value.trim();

            if (u === "beladifard" && p === "HldvUgd.1400") {
                activateAdmin();
            } else {
                failCount++;
                localStorage.setItem('failCount', failCount);
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-trigger').style.display = 'none';
                
                if (failCount >= 5) {
                    localStorage.setItem('lockUntil', Date.now() + 300000);
                    failCount = 0;
                    localStorage.setItem('failCount', 0);
                }
            }
        }

        function activateAdmin() {
            isAdmin = true;
            document.body.classList.add('edit-mode');
            document.getElementById('admin-bar').style.display = 'block';
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-trigger').style.display = 'none';
            renderLinks();
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            container.innerHTML = '';
            links.forEach((link, index) => {
                const a = document.createElement('div');
                a.className = 'link-card';
                a.style.backgroundColor = link.color;
                a.innerHTML = `
                    <i class="fab ${link.icon}"></i>
                    <span>${link.title}</span>
                    <button class="delete-btn" onclick="removeLink(event, ${index})">×</button>
                `;
                a.onclick = () => { 
                    if(!isAdmin) { if(link.url !== "#") window.location.href = link.url; }
                    else { editExistingLink(index); }
                };
                container.appendChild(a);
            });
        }

        function editText(id) {
            if(!isAdmin) return;
            const el = document.getElementById(id);
            const val = prompt("متن جدید:", el.innerText);
            if(val) el.innerText = val;
        }

        function addNewLink() {
            const t = prompt("عنوان:");
            const u = prompt("آدرس (https://...):", "https://");
            if(t && u) {
                links.push({title:t, url:u, icon:'fa-link', color:'#1e293b'});
                saveAndRefresh();
            }
        }

        function removeLink(e, index) {
            e.stopPropagation();
            if(confirm("حذف؟")) { links.splice(index, 1); saveAndRefresh(); }
        }

        function editExistingLink(index) {
            const t = prompt("عنوان جدید:", links[index].title);
            if(t) {
                links[index].title = t;
                links[index].url = prompt("آدرس جدید:", links[index].url);
                links[index].color = prompt("رنگ جدید (کد هگز):", links[index].color);
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('myLinks', JSON.stringify(links));
            renderLinks();
        }

        renderLinks();
    </script>
</body>
</html>
