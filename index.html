<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه شخصی - مدیریت پیشرفته</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --accent-color: #38bdf8;
            --success-color: #22c55e;
        }

        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; margin: 0; min-height: 100vh;
        }

        #admin-bar {
            display: none; width: 100%; background: var(--success-color);
            color: white; text-align: center; padding: 10px 0;
            position: fixed; top: 0; left: 0; z-index: 10001; font-weight: bold;
        }

        .profile-container { text-align: center; width: 100%; max-width: 400px; margin-top: 60px; }
        .profile-img { 
            width: 100px; height: 100px; border-radius: 50%; 
            border: 3px solid var(--accent-color); margin-bottom: 15px; 
            object-fit: cover; cursor: default;
        }
        
        .edit-mode .profile-img { border: 3px dashed var(--accent-color); cursor: pointer; }

        .links-wrapper { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        .link-card {
            background-color: var(--card-bg); color: white; text-decoration: none;
            padding: 15px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; gap: 10px; position: relative; transition: 0.2s;
        }

        .link-card img { width: 24px; height: 24px; border-radius: 4px; }

        /* استایل درگ کردن */
        .edit-mode .link-card { cursor: move; border: 1px solid #334155; }
        .dragging { opacity: 0.5; transform: scale(0.95); }

        #admin-trigger {
            display: none; position: fixed; bottom: 20px; left: 20px;
            width: 15px; height: 15px; background: rgba(255,255,255,0.2);
            border-radius: 50%; cursor: pointer; z-index: 9999;
        }

        #login-box {
            display: none; position: fixed; bottom: 45px; left: 20px;
            background: #1e293b; padding: 12px; border-radius: 8px;
            border: 1px solid #334155; flex-direction: column; gap: 8px; z-index: 10000;
        }

        input {
            background: #0f172a; border: 1px solid #334155; color: white;
            padding: 8px; border-radius: 4px; outline: none; font-size: 13px;
        }

        .action-btn {
            background: var(--accent-color); color: #000; border: none;
            padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }

        .edit-mode .editable { border: 1px dashed var(--accent-color); padding: 2px; }
        
        .delete-btn {
            display: none; position: absolute; right: -10px; top: -10px;
            background: #ef4444; color: white; border-radius: 50%;
            width: 22px; height: 22px; border: none; cursor: pointer;
            z-index: 100; align-items: center; justify-content: center; font-size: 14px;
        }
        .edit-mode .delete-btn { display: flex; }

        .add-btn, .save-exit-btn {
            display: none; margin-top: 15px; border: none; padding: 12px; 
            border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; color: white;
        }
        .add-btn { background: #475569; }
        .save-exit-btn { background: var(--success-color); margin-bottom: 50px; }
        
        .edit-mode .add-btn, .edit-mode .save-exit-btn { display: block; }
    </style>
</head>
<body id="main-body">

    <div id="admin-bar">حالت ویرایش فعال است</div>

    <div class="profile-container">
        <img id="p-img" src="https://via.placeholder.com/100" class="profile-img" onclick="editProfilePic()">
        <h1 id="user-name" class="editable" onclick="editText('user-name')">نام شما</h1>
        <p id="user-bio" class="editable" onclick="editText('user-bio')">توضیحات کوتاه</p>

        <div id="links-container" class="links-wrapper"></div>
        
        <button class="add-btn" onclick="addNewLink()">+ افزودن لینک جدید</button>
        <button class="save-exit-btn" onclick="exitEditMode()">ذخیره نهایی و خروج</button>
    </div>

    <div id="admin-trigger" onclick="toggleBox('login-box')"></div>
    
    <div id="login-box">
        <input type="password" id="u-field" placeholder="1">
        <input type="password" id="p-field" placeholder="2">
        <button class="action-btn" onclick="processLogin()">ورود</button>
    </div>

    <script>
        let isAdmin = false;
        let storedU = localStorage.getItem('adminU') || "100";
        let storedP = localStorage.getItem('adminP') || "200";

        let profileData = JSON.parse(localStorage.getItem('profileData')) || {
            name: "نام شما",
            bio: "توضیحات کوتاه",
            img: "https://via.placeholder.com/100"
        };

        let links = JSON.parse(localStorage.getItem('myLinks')) || [
            { title: 'اینستاگرام', url: 'https://instagram.com', icon: '', color: '#1e293b' }
        ];

        // لود اولیه داده‌ها
        function init() {
            document.getElementById('user-name').innerText = profileData.name;
            document.getElementById('user-bio').innerText = profileData.bio;
            document.getElementById('p-img').src = profileData.img;
            renderLinks();
        }

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.altKey && e.shiftKey && e.code === 'KeyL') {
                const trg = document.getElementById('admin-trigger');
                trg.style.display = (trg.style.display === 'block') ? 'none' : 'block';
            }
        });

        function toggleBox(id) {
            const box = document.getElementById(id);
            box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        }

        function processLogin() {
            if (document.getElementById('u-field').value === storedU && 
                document.getElementById('p-field').value === storedP) {
                isAdmin = true;
                document.body.classList.add('edit-mode');
                toggleBox('login-box');
                renderLinks();
            }
        }

        function exitEditMode() {
            isAdmin = false;
            document.body.classList.remove('edit-mode');
            localStorage.setItem('profileData', JSON.stringify({
                name: document.getElementById('user-name').innerText,
                bio: document.getElementById('user-bio').innerText,
                img: document.getElementById('p-img').src
            }));
            saveAndRefresh();
        }

        function editProfilePic() {
            if(!isAdmin) return;
            const newImg = prompt("لینک عکس پروفایل جدید را وارد کنید:", document.getElementById('p-img').src);
            if(newImg) document.getElementById('p-img').src = newImg;
        }

        function editText(id) {
            if(!isAdmin) return;
            const val = prompt("تغییر متن:", document.getElementById(id).innerText);
            if(val) document.getElementById(id).innerText = val;
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            container.innerHTML = '';
            links.forEach((link, index) => {
                const div = document.createElement('div');
                div.className = 'link-card';
                div.draggable = isAdmin;
                div.style.backgroundColor = link.color;
                
                let iconHtml = link.icon ? `<img src="${link.icon}">` : '';
                div.innerHTML = `
                    ${iconHtml}
                    <span>${link.title}</span>
                    <button class="delete-btn" onclick="removeLink(event, ${index})">×</button>
                `;

                div.onclick = () => { 
                    if(isAdmin) editExistingLink(index);
                    else window.location.href = link.url;
                };

                // رویدادهای درگ و دراپ
                if(isAdmin) {
                    div.addEventListener('dragstart', () => div.classList.add('dragging'));
                    div.addEventListener('dragend', () => div.classList.remove('dragging'));
                }

                container.appendChild(div);
            });
        }

        // منطق جابه‌جایی (Sortable)
        const container = document.getElementById('links-container');
        container.addEventListener('dragover', e => {
            if(!isAdmin) return;
            e.preventDefault();
            const draggingItem = document.querySelector('.dragging');
            const siblings = [...container.querySelectorAll('.link-card:not(.dragging)')];
            let nextSibling = siblings.find(sibling => {
                return e.clientY <= sibling.offsetTop + sibling.offsetHeight / 2;
            });
            container.insertBefore(draggingItem, nextSibling);
        });

        container.addEventListener('drop', () => {
            if(!isAdmin) return;
            // به‌روزرسانی آرایه بر اساس ترتیب جدید در DOM
            const newOrder = [];
            document.querySelectorAll('.link-card').forEach(card => {
                const title = card.querySelector('span').innerText;
                const found = links.find(l => l.title === title);
                if(found) newOrder.push(found);
            });
            links = newOrder;
        });

        function addNewLink() {
            const title = prompt("عنوان لینک:");
            const url = prompt("آدرس (URL):", "https://");
            const icon = prompt("لینک آیکون (اختیاری):");
            if(title && url) {
                links.push({title, url, icon, color:'#1e293b'});
                saveAndRefresh();
            }
        }

        function editExistingLink(index) {
            const t = prompt("۱. عنوان جدید:", links[index].title);
            const u = prompt("۲. آدرس جدید:", links[index].url);
            const i = prompt("۳. آیکون جدید (خالی برای حذف):", links[index].icon || "");
            
            if(t && u) {
                links[index].title = t;
                links[index].url = u;
                links[index].icon = i;
                saveAndRefresh();
            }
        }

        function removeLink(e, index) {
            e.stopPropagation();
            if(confirm("حذف این لینک؟")) { links.splice(index, 1); saveAndRefresh(); }
        }

        function saveAndRefresh() {
            localStorage.setItem('myLinks', JSON.stringify(links));
            renderLinks();
        }

        init();
    </script>
</body>
</html>
