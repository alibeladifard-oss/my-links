<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه لینک‌ها</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
            --accent-color: #38bdf8;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; margin: 0; min-height: 100vh;
        }

        .profile-container { text-align: center; width: 100%; max-width: 400px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--accent-color); margin-bottom: 15px; object-fit: cover; }
        .links-wrapper { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        .link-card {
            background-color: var(--card-bg); color: white; text-decoration: none;
            padding: 15px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; gap: 10px; transition: 0.3s; position: relative;
        }

        /* المان‌های مخفی مدیریت */
        #admin-trigger {
            display: none; position: fixed; bottom: 10px; left: 10px;
            width: 8px; height: 8px; background: rgba(255,255,255,0.05);
            border-radius: 50%; cursor: pointer; z-index: 1000;
        }

        #login-box {
            display: none; position: fixed; bottom: 30px; left: 10px;
            background: #1e293b; padding: 10px; border-radius: 8px;
            border: 1px solid #334155; flex-direction: column; gap: 6px; z-index: 1001;
        }

        #login-box input {
            background: #0f172a; border: 1px solid #334155; color: white;
            padding: 8px; border-radius: 4px; outline: none; width: 140px; font-size: 12px;
        }

        .edit-mode .delete-btn {
            position: absolute; right: -8px; top: -8px; background: #ef4444;
            color: white; border-radius: 50%; width: 20px; height: 20px;
            border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 10px;
        }

        .add-btn {
            display: none; margin-top: 25px; background: var(--accent-color);
            border: none; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%;
            font-weight: bold; color: #0f172a;
        }

        .edit-mode .add-btn { display: block; }
        .edit-mode .editable:hover { outline: 1px dashed var(--accent-color); cursor: pointer; }
    </style>
</head>
<body>

    <div class="profile-container">
        <img src="https://via.placeholder.com/100" class="profile-img" id="profile-pic">
        <h1 id="user-name" class="editable" onclick="editText('user-name')">نام شما</h1>
        <p id="user-bio" class="editable" onclick="editText('user-bio')">توضیحات کوتاه</p>

        <div id="links-container" class="links-wrapper"></div>
        <button class="add-btn" onclick="addNewLink()">+ افزودن لینک جدید</button>
    </div>

    <div id="admin-trigger" onclick="toggleLoginBox()"></div>
    
    <div id="login-box">
        <input type="text" id="u-field" autocomplete="off" placeholder="" onkeydown="if(event.key==='Enter')event.preventDefault()">
        <input type="password" id="p-field" autocomplete="off" placeholder="" onkeydown="if(event.key==='Enter')event.preventDefault()">
    </div>

    <script>
        let isAdmin = false;
        let failCount = parseInt(localStorage.getItem('failCount')) || 0;
        let lockUntil = parseInt(localStorage.getItem('lockUntil')) || 0;

        let links = JSON.parse(localStorage.getItem('myLinks')) || [
            { title: 'اینستاگرام', url: '#', icon: 'fa-instagram', color: '#1e293b' }
        ];

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.altKey && e.shiftKey && e.code === 'KeyL') {
                e.preventDefault();
                handleAdminAction();
            }
        });

        function handleAdminAction() {
            const now = Date.now();
            if (now < lockUntil) {
                console.log("قفل امنیتی فعال است.");
                return;
            }

            const box = document.getElementById('login-box');
            const trigger = document.getElementById('admin-trigger');

            // اگر باکس باز است، یعنی کاربر می‌خواهد وارد شود
            if (box.style.display === 'flex') {
                processLogin();
            } else {
                // اگر باکس بسته است، فقط نمایش دایره و باکس
                trigger.style.display = 'block';
                box.style.display = 'flex';
                document.getElementById('u-field').focus();
            }
        }

        function processLogin() {
            const u = document.getElementById('u-field').value;
            const p = document.getElementById('p-field').value;
            const box = document.getElementById('login-box');
            const trigger = document.getElementById('admin-trigger');

            if (u === "beladifard" && p === "HldvUgd.1400") {
                isAdmin = true;
                failCount = 0;
                localStorage.setItem('failCount', 0);
                document.body.classList.add('edit-mode');
                box.style.display = 'none';
                trigger.style.display = 'none';
                renderLinks();
            } else {
                // اشتباه وارد شده
                failCount++;
                localStorage.setItem('failCount', failCount);
                
                // پنهان سازی کامل
                box.style.display = 'none';
                trigger.style.display = 'none';
                document.getElementById('u-field').value = '';
                document.getElementById('p-field').value = '';

                if (failCount >= 2) {
                    const blockTime = Date.now() + (5 * 60 * 1000); // 5 دقیقه
                    localStorage.setItem('lockUntil', blockTime);
                    lockUntil = blockTime;
                    failCount = 0; // ریست شمارنده بعد از قفل شدن
                    localStorage.setItem('failCount', 0);
                }
            }
        }

        function toggleLoginBox() {
            const box = document.getElementById('login-box');
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        function renderLinks() {
            const container = document.getElementById('links-container');
            container.innerHTML = '';
            links.forEach((link, index) => {
                const a = document.createElement('div');
                a.className = 'link-card';
                a.style.backgroundColor = link.color;
                a.innerHTML = `
                    <i class="fab ${link.icon}"></i>
                    <span>${link.title}</span>
                    ${isAdmin ? `<button class="delete-btn" onclick="removeLink(event, ${index})"><i class="fas fa-times"></i></button>` : ''}
                `;
                a.onclick = () => { 
                    if(!isAdmin) window.location.href = link.url;
                    else editExistingLink(index);
                };
                container.appendChild(a);
            });
        }

        function editText(id) {
            if(!isAdmin) return;
            const val = prompt("تغییر متن:", document.getElementById(id).innerText);
            if(val) document.getElementById(id).innerText = val;
        }

        function addNewLink() {
            const t = prompt("عنوان:");
            const u = prompt("آدرس:", "https://");
            const i = prompt("آیکون (مثلا fa-link):", "fa-link");
            const c = prompt("رنگ باکس:", "#1e293b");
            if(t && u) { links.push({title:t, url:u, icon:i, color:c}); saveAndRefresh(); }
        }

        function removeLink(e, index) {
            e.stopPropagation();
            if(confirm("حذف؟")) { links.splice(index, 1); saveAndRefresh(); }
        }

        function editExistingLink(index) {
            const l = links[index];
            const t = prompt("عنوان:", l.title);
            if(t) {
                links[index] = { title:t, url:prompt("آدرس:",l.url), icon:prompt("آیکون:",l.icon), color:prompt("رنگ:",l.color) };
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('myLinks', JSON.stringify(links));
            renderLinks();
        }

        renderLinks();
    </script>
</body>
</html>
